<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 128 128">
  <defs>
    <style>
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      .rotate {
        animation: spin 8s linear infinite;
        transform-origin: 64px 64px;
      }
    </style>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a855f7;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="128" height="128" fill="#050b18"/>

  <!-- Rotating gradient border -->
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#grad)" stroke-width="3" opacity="0.8" class="rotate" filter="url(#glow)"/>

  <!-- Static border -->
  <circle cx="64" cy="64" r="58" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.4"/>

  <!-- Avatar circle -->
  <circle cx="64" cy="64" r="56" fill="#0a0f1e" stroke="url(#grad)" stroke-width="2"/>

  <!-- Inner glow -->
  <circle cx="64" cy="64" r="54" fill="none" stroke="url(#grad)" stroke-width="1" opacity="0.2" filter="url(#glow)"/>

  <!-- Initial G -->
  <circle cx="64" cy="64" r="52" fill="url(#grad)" opacity="0.15"/>
  <text x="64" y="78" font-family="Poppins, Arial, sans-serif" font-size="56" font-weight="900" text-anchor="middle" fill="white" opacity="0.95">G</text>
</svg>
